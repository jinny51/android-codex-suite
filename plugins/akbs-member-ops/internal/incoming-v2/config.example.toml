default_profile = "member_alias"

[paths]
codex_home = "$CODEX_HOME"
out_dir = "$CODEX_HOME/artifacts/akbs-member-ops"

include_patches = true
incoming_schema_version = "2"
max_attachment_mb = 5
push_retries = 3
timezone = "Asia/Shanghai"
weekly_history_api_enabled = true
weekly_history_api_timeout_seconds = 3

[profiles.member_alias]
member_alias = "member_alias"
member_name = "成员姓名"
role = "member"
allowed_modes = ["daily", "weekly", "patch"]
knowledge_repo_worktree = "$CODEX_HOME/worktrees/knowledge"
git_user_name = "成员姓名"
git_user_email = "member_alias@codex.local"

[profiles.admin_alias]
member_alias = "admin_alias"
member_name = "链路测试"
role = "admin"
allowed_modes = ["patch"]
knowledge_repo_worktree = "$CODEX_HOME/worktrees/knowledge"
git_user_name = "链路测试"
git_user_email = "admin_alias@codex.local"

# 普通成员 TOML 只保存身份和本地路径。AKBS endpoint resolver 提供 HTTP 上传入口。
# 成员请求只发送 member_alias；服务端根据固定工作站来源 IP 验证身份。
# AKBS HTTP 上传环境配置：
# CODEX_REPORT_AKBS_ENDPOINT_SUBMISSION_API_BASE_URL=http://<akbs-host>:8088/akbs/api
